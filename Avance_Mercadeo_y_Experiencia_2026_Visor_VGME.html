<script>
(function(){
  // En vista local (file://) permitir la previsualizacion sin depender de auth-vgme.js.
  if(location.protocol==='file:'){
    document.documentElement.classList.remove('vgme-auth-pending');
    document.documentElement.style.setProperty('visibility','visible','important');
    return;
  }
  // En GitHub / servidor se conserva el bloqueo de acceso.
  document.documentElement.classList.add('vgme-auth-pending');
  var s=document.createElement('script');
  s.src='./auth-vgme.js';
  s.defer=true;
  s.onload=function(){
    setTimeout(function(){document.documentElement.classList.remove('vgme-auth-pending')},50);
  };
  s.onerror=function(){
    document.documentElement.classList.remove('vgme-auth-pending');
  };
  document.head.appendChild(s);
})();
</script>
