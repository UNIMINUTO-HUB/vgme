<script>
(function(){

  if(location.protocol==='file:'){
    document.documentElement.classList.remove('vgme-auth-pending');
    document.documentElement.style.setProperty('visibility','visible','important');
    return;
  }
  // En GitHub / servidor se conserva el bloqueo de acceso.
  document.documentElement.classList.add('vgme-auth-pending');
  var s=document.createElement('script');
  s.src='./auth-vgme.js';
  s.defer=true;
  s.onload=function(){
    setTimeout(function(){document.documentElement.classList.remove('vgme-auth-pending')},50);
  };
  s.onerror=function(){
    document.documentElement.classList.remove('vgme-auth-pending');
  };
  document.head.appendChild(s);
})();
</script>

function showStatus(msg,ms=2200){statusBox.textContent=msg;statusBox.style.display='block';clearTimeout(showStatus.t);showStatus.t=setTimeout(()=>statusBox.style.display='none',ms)}
function base64ToBlobUrl(base64){if(currentBlobUrl)URL.revokeObjectURL(currentBlobUrl);const bin=atob(base64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);currentBlobUrl=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));return currentBlobUrl}
function clamp(v){return Math.max(0,Math.min(255,v))}function hexToRgb(hex){const h=String(hex||'').replace('#','');if(!/^[0-9a-fA-F]{6}$/.test(h))return{r:0,g:59,b:113};return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)}}function rgbToHex(o){return'#'+[o.r,o.g,o.b].map(v=>clamp(Math.round(v)).toString(16).padStart(2,'0')).join('').toUpperCase()}function mix(hex,target,a){const x=hexToRgb(hex),y=hexToRgb(target);return rgbToHex({r:x.r+(y.r-x.r)*a,g:x.g+(y.g-x.g)*a,b:x.b+(y.b-x.b)*a})}
function applyThemeColor(c){currentThemeColor=c||'#003B71';const r=document.documentElement.style;r.setProperty('--h1',mix(currentThemeColor,'#000000',.28));r.setProperty('--h2',currentThemeColor);r.setProperty('--h3',mix(currentThemeColor,'#FFFFFF',.18))}
function renderPdf(){applyThemeColor(currentThemeColor);titleText.textContent=currentTitle;subtitleText.textContent=currentSubtitle;subtitleText.style.display=currentSubtitle?'block':'none';document.title=currentTitle+' · VGME';if(!currentPdfBase64){pdfFrame.style.display='none';emptyState.style.display='flex';pdfFrame.removeAttribute('src');return}pdfFrame.src=base64ToBlobUrl(currentPdfBase64)+'#view=FitH&toolbar=1&navpanes=0';pdfFrame.style.display='block';emptyState.style.display='none'}
function openAdmin(){passwordInput.value='';passwordModal.classList.add('open');setTimeout(()=>passwordInput.focus(),60)}function unlockAdmin(){if(passwordInput.value===ADMIN_PASSWORD){app.classList.add('adminVisible');passwordModal.classList.remove('open');showStatus('Administración habilitada')}else{passwordInput.select();showStatus('Contraseña incorrecta')}}
function readPdf(file){if(!file)return;if(file.type&&file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){showStatus('Selecciona un archivo PDF');return}const reader=new FileReader();reader.onload=()=>{const res=String(reader.result||''),comma=res.indexOf(',');currentPdfBase64=comma>=0?res.slice(comma+1):'';if(!currentTitle||currentTitle==='Visor de Presentaciones')currentTitle=file.name.replace(/\.pdf$/i,'');renderPdf();showStatus('PDF cargado correctamente')};reader.onerror=()=>showStatus('No fue posible leer el PDF');reader.readAsDataURL(file)}
function saveUpdatedHtml(){if(!currentPdfBase64){showStatus('Primero carga un PDF');return}let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;const payload=JSON.stringify({title:currentTitle,subtitle:currentSubtitle,pdf:currentPdfBase64,themeColor:currentThemeColor}).replace(/</g,'\\u003c');html=html.replace(/const INITIAL_DATA=\{[\s\S]*?\};/,'const INITIAL_DATA='+payload+';').replace(/<div class="app adminVisible" id="app">/,'<div class="app" id="app">').replace(/<div class="modal" id="passwordModal">/,'<div class="modal" id="passwordModal">').replace(/<div class="modal" id="titleModal">/,'<div class="modal" id="titleModal">').replace(/<div class="modal" id="colorModal">/,'<div class="modal" id="colorModal">');const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a'),safe=(currentTitle||'Presentacion_VGME').replace(/[\\/:*?"<>|]+/g,'_').trim()||'Presentacion_VGME';a.href=url;a.download=safe+'_Visor_VGME.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);showStatus('HTML actualizado guardado')}
async function toggleFullscreen(){try{if(!document.fullscreenElement)await $("viewerCard").requestFullscreen();else await document.exitFullscreen()}catch(e){showStatus('El navegador no permitió pantalla completa')}}
renderPdf();subtitleText.addEventListener('dblclick',openAdmin);$("unlockBtn").onclick=openAdmin;$("cancelPassword").onclick=()=>passwordModal.classList.remove('open');$("confirmPassword").onclick=unlockAdmin;passwordInput.addEventListener('keydown',e=>{if(e.key==='Enter')unlockAdmin()});passwordModal.addEventListener('click',e=>{if(e.target===passwordModal)passwordModal.classList.remove('open')});pdfInput.addEventListener('change',e=>readPdf(e.target.files&&e.target.files[0]));$("saveBtn").onclick=saveUpdatedHtml;$("hideBtn").onclick=()=>{app.classList.remove('adminVisible');showStatus('Administración oculta')};$("fullBtn").onclick=toggleFullscreen;
$("titleBtn").onclick=()=>{titleInput.value=currentTitle;subtitleInput.value=currentSubtitle;titleModal.classList.add('open');setTimeout(()=>{titleInput.focus();titleInput.select()},60)};$("cancelTitle").onclick=()=>titleModal.classList.remove('open');$("confirmTitle").onclick=()=>{const t=titleInput.value.trim();if(t)currentTitle=t;currentSubtitle=subtitleInput.value.trim();titleModal.classList.remove('open');renderPdf();showStatus('Título y subtítulo actualizados')};titleInput.addEventListener('keydown',e=>{if(e.key==='Enter')subtitleInput.focus()});subtitleInput.addEventListener('keydown',e=>{if(e.key==='Enter')$("confirmTitle").click()});titleModal.addEventListener('click',e=>{if(e.target===titleModal)titleModal.classList.remove('open')});
function selectColor(c){pendingThemeColor=c;customColor.value=c;document.querySelectorAll('.colorChoice').forEach(b=>b.classList.toggle('active',b.dataset.color.toUpperCase()===c.toUpperCase()))}$("colorBtn").onclick=()=>{selectColor(currentThemeColor);colorModal.classList.add('open')};$("cancelColor").onclick=()=>colorModal.classList.remove('open');document.querySelectorAll('.colorChoice').forEach(b=>b.onclick=()=>selectColor(b.dataset.color));customColor.addEventListener('input',()=>{pendingThemeColor=customColor.value;document.querySelectorAll('.colorChoice').forEach(b=>b.classList.remove('active'))});$("confirmColor").onclick=()=>{applyThemeColor(pendingThemeColor||customColor.value||'#003B71');colorModal.classList.remove('open');showStatus('Color superior actualizado')};colorModal.addEventListener('click',e=>{if(e.target===colorModal)colorModal.classList.remove('open')});
</script>
