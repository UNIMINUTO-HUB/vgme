<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal VGME · Funnels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="vgme-auth-lock">
html{background:#061a3a!important}
html.vgme-auth-pending{visibility:hidden!important}
</style>
<script>
(function(){
  // En vista local (file://) permitir la previsualizacion sin depender de auth-vgme.js.
  if(location.protocol==='file:'){
    document.documentElement.classList.remove('vgme-auth-pending');
    document.documentElement.style.setProperty('visibility','visible','important');
    return;
  }
  // En GitHub / servidor se conserva el bloqueo de acceso.
  document.documentElement.classList.add('vgme-auth-pending');
  var s=document.createElement('script');
  s.src='./auth-vgme.js';
  s.defer=true;
  s.onload=function(){
    setTimeout(function(){document.documentElement.classList.remove('vgme-auth-pending')},50);
  };
  s.onerror=function(){
    document.documentElement.classList.remove('vgme-auth-pending');
  };
  document.head.appendChild(s);
})();
</script>
<style>
:root{
  --deep:#061a3a;--deep2:#0b2752;--yellow:#ffc800;--bg:#f4f6fa;--ink:#0f1f38;--ink2:#3c4d66;--muted:#6c7b91;--line:#e1e7f0;
  --cur:#1f56c2;--prev:#9fb3d3;--good:#0f8a6c;--bad:#c0392b;--amber:#b07a00;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.num{font-family:Archivo,Inter,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}

/* barra fija */
.topbar{position:fixed;top:0;left:0;right:0;z-index:80;display:flex;align-items:center;gap:16px;padding:10px 24px;background:rgba(6,26,58,.82);backdrop-filter:blur(10px);color:#fff;transition:background .3s}
.topbar b{font:700 14px Archivo,sans-serif}
.topbar .sp{flex:1}
.ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:#b8c6dc}
.ctl select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:7px;color:#fff;padding:5px 8px;font-weight:700}
.ctl select option{color:#000}
.seg{display:flex;border:1px solid rgba(255,255,255,.2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;color:#b8c6dc;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:600}
.seg button.on{background:var(--yellow);color:var(--deep)}
.topbar a{color:#fff;text-decoration:none;font-weight:700;font-size:12px;opacity:.85}
.progress{position:fixed;top:0;left:0;height:3px;background:var(--yellow);z-index:90;width:0}
.dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:70;display:flex;flex-direction:column;gap:10px}
.dots a{width:10px;height:10px;border-radius:50%;background:#c3cddc;display:block;position:relative;transition:all .25s}
.dots a.on{background:var(--cur);transform:scale(1.35)}
.dots a span{position:absolute;right:18px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--deep);color:#fff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}
.dots a:hover span{opacity:1}
.dark-dots .dots a{background:rgba(255,255,255,.35)}.dark-dots .dots a.on{background:var(--yellow)}

/* secciones */
section{position:relative;padding:110px 0}
.kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--cur);margin:0 0 14px}
h2{font:800 clamp(30px,4vw,48px)/1.08 Archivo,sans-serif;letter-spacing:-.025em;margin:0 0 16px;max-width:900px}
.lead{font-size:clamp(16px,1.5vw,19px);line-height:1.6;color:var(--ink2);max-width:720px;margin:0}
.lead b{color:var(--ink)}

/* revelado */
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.in .rv,.rv.in{opacity:1;transform:none}
.d1{transition-delay:.12s}.d2{transition-delay:.24s}.d3{transition-delay:.36s}.d4{transition-delay:.48s}

/* hero */
.hero{min-height:100vh;display:flex;align-items:center;background:radial-gradient(1200px 600px at 75% 20%,#1b4a9a 0%,transparent 60%),radial-gradient(900px 500px at 10% 90%,#0e3a6e 0%,transparent 60%),var(--deep);color:#fff;overflow:hidden}
.hero .kicker{color:var(--yellow)}
.hero h1{font:900 clamp(64px,11vw,150px)/.95 Archivo,sans-serif;letter-spacing:-.04em;margin:0}
.hero h1 small{display:block;font:700 clamp(20px,2.4vw,30px)/1.2 Archivo,sans-serif;letter-spacing:-.01em;color:#c9d6ea;margin-top:14px}
.hero .chips{display:flex;gap:14px;flex-wrap:wrap;margin-top:42px}
.hero .chip{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);border-radius:14px;padding:16px 20px;min-width:190px}
.hero .chip small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9fb1cc}
.hero .chip b{display:block;font:800 30px Archivo,sans-serif;margin-top:6px}
.hero .chip em{display:block;font-style:normal;font-size:12px;color:#9fb1cc;margin-top:4px}
.hero .chip>span{font-size:13px;font-weight:700}
.hero .chip .up{color:#5fe0b5}.hero .chip .down{color:#ff8b7e}
.scrollhint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);color:#9fb1cc;font-size:12px;letter-spacing:.12em;text-transform:uppercase;animation:bob 2s infinite}
@keyframes bob{50%{transform:translate(-50%,8px)}}
.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5}

/* embudo grande */
.funnel-wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;align-items:center;margin-top:46px}
.bigfunnel svg{width:100%;height:auto;display:block;overflow:visible}
.bigfunnel .st{transform-box:fill-box;transform-origin:center;transform:scaleX(0);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.bigfunnel .gh{opacity:0;transition:opacity 1s .9s}
.bigfunnel .lb{opacity:0;transition:opacity .6s}
.in .bigfunnel .st{transform:scaleX(1)}
.in .bigfunnel .gh,.in .bigfunnel .lb{opacity:1}
.steps{display:flex;flex-direction:column;gap:14px}
.step{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.step small{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.step b{font:800 26px Archivo,sans-serif}
.step em{font-style:normal;font-size:13px;font-weight:700;text-align:right}
.step i{font-style:normal;font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--ink2);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:22px;height:10px;border-radius:3px;display:inline-block}

/* calidad */
.dark{background:var(--deep);color:#fff}
.dark .kicker{color:var(--yellow)}.dark .lead{color:#c3d0e2}.dark .lead b{color:#fff}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:30px;align-items:end;margin-top:50px}
.vs .side{text-align:center}
.vs .side small{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#9fb1cc;text-transform:uppercase}
.vs .side b{display:block;font:900 clamp(70px,10vw,130px)/1 Archivo,sans-serif;letter-spacing:-.04em}
.vs .side>span{color:#9fb1cc;font-size:14px}
.vs .arrow{font:800 40px Archivo,sans-serif;color:var(--yellow);padding-bottom:40px}
.dotsgrid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px}
.people{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.people i{width:11px;height:11px;border-radius:3px;background:rgba(255,255,255,.18);transform:scale(0);transition:transform .35s}
.people i.m{background:var(--yellow)}
.in .people i{transform:scale(1)}
.cap{text-align:center;color:#9fb1cc;font-size:13px;margin-top:12px}

/* mezcla */
.mix svg{width:100%;height:auto;display:block;margin-top:40px}
.mix .rib{opacity:0;transition:opacity 1.2s .5s}
.mix .sg{transform-box:fill-box;transform-origin:left;transform:scaleX(0);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.in.mix .rib{opacity:.28}.in.mix .sg{transform:scaleX(1)}
.ixrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:30px}
.ix{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;border-top:4px solid}
.ix small{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
.ix b{display:block;font:800 26px Archivo,sans-serif;margin-top:4px}
.ix>span{font-size:11.5px;color:var(--muted)}

/* capítulos */
.chap{padding:90px 0;border-top:1px solid var(--line)}
.chap-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:50px;align-items:start}
.chap .tag{display:inline-flex;gap:8px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:999px;color:#fff;margin-bottom:16px}
.chap h3{font:800 clamp(30px,3.6vw,44px)/1.05 Archivo,sans-serif;letter-spacing:-.025em;margin:0 0 14px}
.chap p.say{font-size:17px;line-height:1.6;color:var(--ink2);margin:0 0 22px}
.chap p.say b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font:800 22px Archivo,sans-serif;margin-top:4px}
.stat>span{font-size:12px;font-weight:700}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px 26px;box-shadow:0 18px 40px rgba(15,33,58,.06)}
.pills{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;transition:all .2s}
.pills button.on{color:#fff;border-color:transparent}
.race .row{display:grid;grid-template-columns:96px minmax(0,1fr) 112px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.race .row:last-child{border-bottom:0}
.race .nm{font-size:13px;font-weight:700;color:var(--ink2)}
.race .nm small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
.track{position:relative;height:40px}
.bar{position:absolute;left:0;border-radius:8px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar.c{top:0;height:24px}
.bar.p{top:29px;height:9px;background:var(--prev);opacity:.7}
.bar.c b{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#fff;font:800 13px Archivo,sans-serif;white-space:nowrap}
.bar.c b.out{left:auto;right:-8px;transform:translate(100%,-50%);color:var(--ink)}
.race .vv{text-align:right;font-size:12px;color:var(--muted)}
.race .vv b{display:block;font:800 15px Archivo,sans-serif;color:var(--ink)}
.note{margin-top:14px;font-size:12px;color:#7a5a12;background:#fbf2e4;border-radius:10px;padding:9px 12px;line-height:1.5}
.scale{margin-top:10px;font-size:11px;color:var(--muted)}

.panel.big{padding:22px 24px}
.tw,.pano{width:100%;height:auto;display:block}
.tw .st,.pano .st{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.tw .lb,.pano .lb{opacity:0;transition:opacity .6s}
.pano .sg{transform-box:fill-box;transform-origin:left;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.in .go .st{transform:none}.in .go .lb{opacity:1}.in .go .sg{transform:none}
.chap-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:22px}
.chap-head p.say{max-width:820px;margin:0}
.hl4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
.hl{background:#f1f5fb;border-top:3px solid var(--cur);border-radius:12px;padding:16px;text-align:center}
.hl small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hl b{display:block;font-size:24px;font-weight:800;margin:6px 0 4px;color:#0b2a5b}
.hl span{font-size:12.5px;color:var(--muted)}
.hl.bad{background:#fdecea;border-top-color:var(--bad)}.hl.bad b{color:var(--bad)}
@media (max-width:900px){.chap-head{flex-direction:column;align-items:flex-start}.hl4{grid-template-columns:1fr 1fr}}
/* combinaciones */
.combos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:40px}
.combo{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
.combo h4{margin:0 0 4px;font:800 19px Archivo,sans-serif}
.combo p{margin:0 0 14px;font-size:12.5px;color:var(--muted)}
.mf{display:flex;flex-direction:column;align-items:center;gap:4px}
.mf div{height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font:800 12px Archivo,sans-serif;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.combo .foot{display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px;color:var(--ink2)}
.combo .foot b{font-family:Archivo,sans-serif}

/* comercial */
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:44px}
.big-callout{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center;margin-top:44px}
.ring{width:260px;height:260px}
.ring circle{fill:none;stroke-width:26}
.ring .arc{stroke:var(--yellow);stroke-linecap:round;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)}
.ring text{font-family:Archivo,'Segoe UI',Arial,sans-serif}

/* cierre */
.take{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:40px}
.take div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px}
.take b{display:block;font:800 13px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow);margin-bottom:8px}
.take p{margin:0;font-size:16px;line-height:1.55;color:#dbe4f2}
.take p strong{color:#fff}
.foot{color:#7f8fa8;font-size:12px;margin-top:50px}

@media (max-width:900px){
  .funnel-wrap,.chap-grid,.two,.big-callout,.dotsgrid{grid-template-columns:1fr}
  .ixrow{grid-template-columns:repeat(3,1fr)}.combos{grid-template-columns:1fr}.take{grid-template-columns:1fr}
  .dots{display:none}.topbar .brandtxt{display:none}.vs{grid-template-columns:1fr}.vs .arrow{display:none}
  .ring{width:200px;height:200px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* página continua: sin cajas */
.panel,.panel.big{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;border-radius:0}
section{padding:80px 0}.chap{padding:60px 0;border-top:0}
#comercial{padding-bottom:0}
.vs .side small,.cap{color:var(--muted)}.vs .side>span{color:var(--muted)}
.people i{background:#d6deea}.people i.m{background:var(--cur)}
.ring .arc{stroke:#e89b00}
.hl{background:none;border-top:3px solid var(--cur);border-radius:0;padding:14px 6px}
.hl.bad{background:none}
/* panorama integrado */
.pg{display:grid;grid-template-columns:190px minmax(0,1fr) 190px;gap:22px;margin-top:40px;align-items:stretch}
.pside{display:flex;flex-direction:column}
.pf{flex:1;display:flex;flex-direction:column;gap:6px;margin-top:46px}
.stg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:scaleY(0);transform-origin:top;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.in .stg{transform:none}
.stg>span{font-size:12px;font-weight:700;opacity:.9}.stg b{font-size:19px;font-weight:800}
.ph{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding-bottom:8px;border-bottom:2.5px solid}
.ph.cur{color:var(--cur);border-color:var(--cur)}.ph.old{color:var(--muted);border-color:#b7c4da}
.pt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 150px repeat(3,minmax(0,1fr));column-gap:0;align-items:center}
.pt>.ph.cur{margin-right:10px}.pt>.ph.old{margin-left:10px}
.pt>.ph{margin-bottom:0}
.pc{white-space:nowrap;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:12px 0 8px}
.prw{display:contents}
.prw>*{height:52px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #e6ebf3}
.pb{position:relative;justify-content:flex-start!important}
.pb{padding:0 6px}.pb i{position:absolute;left:6px;max-width:calc(100% - 12px);top:13px;height:26px;border-radius:4px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.pb span{position:relative;padding-left:8px;font-size:15px;font-weight:800;color:#0b2a5b}
.pb.a i{background:#bbd0f2}.pb.b i{background:#7fa4e3}.pb.c i{background:#dbe1eb}.pb.d i{background:#b8c5d9}
.pb.c span,.pb.d span{color:var(--muted)}
.pix{font-size:18px;font-weight:800}.pix.ok{color:var(--cur)}.pix.ko{color:var(--bad)}.pix.old{font-size:16px;opacity:.75}
.pn{font-weight:800;font-size:15px;color:#22325a;gap:8px}.pn i{width:9px;height:9px;border-radius:50%}
.prw.tot>*{border-bottom:0;border-top:2px solid #cfd8e6;font-size:16px;font-weight:800}
.prw.tot .old{color:var(--muted)}
@media (max-width:900px){.pg{grid-template-columns:1fr}.pside{display:none}.pt{grid-template-columns:repeat(3,1fr) 90px repeat(3,1fr);column-gap:4px}.pb span{font-size:11px}.pn{font-size:12px}}

/* pulido */
.panel.big{margin-top:28px!important}
.tw .row{transition:opacity .3s}
.tw:hover .row{opacity:.42}.tw .row:hover{opacity:1}
.tw .st{transform-origin:center top;transform:scaleY(0) scaleX(.6);transition:transform .9s cubic-bezier(.2,.9,.25,1.05)}
.in .go .st{transform:none}
.stg{filter:drop-shadow(0 6px 8px rgba(11,42,91,.18))}
.stg b{font-family:Archivo,Inter,sans-serif}
.pb i{background-image:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.35))!important;border-radius:6px}
.pb.a i{background-color:#bbd0f2}.pb.b i{background-color:#7fa4e3}.pb.c i{background-color:#dbe1eb}.pb.d i{background-color:#b8c5d9}
.prw>*{transition:background .2s}
.prw:hover>*{background:#eef3fb}

.prw>*{height:64px}
.prw>.pb{display:block!important;position:relative}
.pb i{top:9px!important;height:26px!important}
.pb>span{position:absolute;top:9px;left:6px;line-height:26px;padding-left:8px}
.pb>em{position:absolute;bottom:7px;left:14px;font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap}
.pb>em .num{font-weight:700;color:var(--ink2)}
.tc{flex-direction:column}.tc b{font-size:16px;font-weight:800}.tc em{font-style:normal;font-size:11.5px;color:var(--muted)}
.tc.old b{color:var(--muted)}

/* panorama: columnas de cantidades y espejo */
.pg.wide{position:relative;left:50%;transform:translateX(-50%);width:min(1440px,calc(100vw - 70px));grid-template-columns:170px minmax(0,1fr) 170px}
.pt{grid-template-columns:78px 66px minmax(0,1fr) minmax(0,1fr) 64px 128px 64px minmax(0,1fr) minmax(0,1fr) 66px 78px!important}
.prw>*{height:54px!important}
.pnum{justify-content:flex-end!important;padding-right:8px;font:700 15px Archivo,Inter,sans-serif;color:#0b2a5b}
.pnum.old{justify-content:flex-start!important;padding:0 0 0 8px;color:var(--muted)}

.pb.r i{left:auto!important;right:6px}
.pb.r>span{left:auto!important;right:6px;padding:0 8px 0 0}
.pb>span{top:14px!important}
.pb i{top:14px!important}

  const bar=(x,mid,v,col,txt,dl)=>`<rect x="${x}" y="${mid-15}" width="${BW}" height="30" fill="#f1f4f9" rx="3"/><rect class="sg" style="transition-delay:${dl}s" x="${x}" y="${mid-15}" width="${Math.max(2,v/mx*BW)}" height="30" fill="${col}" rx="3"/>`+TX(x+8,mid+6,P(v),{s:15,w:800,c:txt,n:1});
  [...rows,{label:'Total',total:true}].forEach((r,i)=>{

/* Panorama integrado en la página (HTML): funnel | 2027 | canal | 2026 | funnel */
function curvePoly(a,b){ // polígono en % que imita los lados curvos
  const pts=[], n=10, bz=(t,p0,p1,p2,p3)=>(1-t)**3*p0+3*(1-t)**2*t*p1+3*(1-t)*t*t*p2+t**3*p3;
  for(let j=0;j<=n;j++){ const t=j/n, x=bz(t,a/2,a/2-(a-b)*.08,b/2+(a-b)*.1,b/2), y=bz(t,0,55,60,100); pts.push([50+x,y]); }
  const right=pts.map(([x,y])=>`${x.toFixed(2)}% ${y.toFixed(2)}%`), left=pts.slice().reverse().map(([x,y])=>`${(100-x).toFixed(2)}% ${y.toFixed(2)}%`);
  return `polygon(${right.concat(left).join(',')})`;
}
/* Panorama integrado en la página: funnel | actual | canal | anterior | funnel */

  const side=(o,pal,lc)=>{ const w=fwidths(o,Math.max(T.l,Tp.l,1),100); return `<div class="pf">`+ST.map((k,i)=>{ const [e,cn]=pal[i].split(',');
    return `<div class="stg" style="background:linear-gradient(90deg,${e},${cn},${e});color:${lc};clip-path:${curvePoly(w[i],i<3?w[i+1]:w[i]*.8)};transition-delay:${i*.12}s"><span>${STN[k]}</span><b>${cnt(o[k])}</b></div>`; }).join('')+'</div>'; };
  const bar=(v,cl,dl,r)=>`<div class="pb ${cl}${r?' r':''}"><i data-w="${v/mx*100}" style="transition-delay:${dl}s"></i><span>${cnt(v*100,'p1')}</span></div>`;

  rows.forEach((r,i)=>{ const dl=.1+i*.07; t+=`<div class="prw">${nm(r.l)}${nm(r.m)}${sl(bar(r.pl,'a',dl))}${bar(r.pm,'b',dl+.08)}${ix(r.ix,1)}<div class="pn"><i style="background:${colorOf(r.key)}"></i>${esc(r.label)}</div>${ix(r.ix0,0)}${bar(r.pm0,'d',dl+.16,1)}${sr(bar(r.pl0,'c',dl+.24,1))}${nm(r.m0,1)}${nm(r.l0,1)}</div>`; });
  t+=`<div class="prw tot">${nm(T.l)}${nm(T.m)}<b class="num sepL">100%</b><b class="num">100%</b><b class="num">1,00x</b><div class="pn">Total</div><b class="num old">1,00x</b><b class="num old">100%</b><b class="num old sepR">100%</b>${nm(Tp.m,1)}${nm(Tp.l,1)}</div></div>`;

function count(el){

  const v=+el.dataset.c, f=el.dataset.f, t0=performance.now(), dur=+(el.dataset.d||1300);

  requestAnimationFrame(step);
}
let io;
function observe(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return;
    const s=e.target; s.classList.add('in'); s.querySelectorAll('[data-c]').forEach(count); grow(s);
    s.querySelectorAll('.arc').forEach(a=>a.style.strokeDashoffset=a.dataset.off); }),{threshold:.22});
  document.querySelectorAll('#story section').forEach(s=>io.observe(s));
}
function onScroll(){
  const h=document.documentElement, p=h.scrollTop/(h.scrollHeight-h.clientHeight||1);
  document.getElementById('prog').style.width=(p*100)+'%';
  let cur=null; document.querySelectorAll('#story section').forEach(s=>{ if(s.getBoundingClientRect().top<innerHeight*.45) cur=s; });
  if(cur){ document.querySelectorAll('#dots a').forEach(a=>a.classList.toggle('on',a.dataset.id===cur.id)); document.body.classList.toggle('dark-dots',!!cur.dataset.dark); }
}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('keydown',e=>{ if(e.target.tagName==='SELECT') return;
  const secs=[...document.querySelectorAll('#story section')], i=secs.findIndex(s=>s.getBoundingClientRect().top>innerHeight*.1);
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){ const t=secs[i<0?secs.length-1:i]; if(t){t.scrollIntoView({behavior:'smooth'}); e.preventDefault();} }
  if(e.key==='ArrowUp'||e.key==='PageUp'){ const t=secs[Math.max(0,(i<0?secs.length:i)-2)]; if(t){t.scrollIntoView({behavior:'smooth'}); e.preventDefault();} } });

/* ---------- controles ---------- */
const sel=document.getElementById('fAnio');
DATA.meta.anios.filter(y=>DATA.meta.anios.includes(y-1)).sort((a,b)=>b-a).forEach(y=>sel.add(new Option(`${y} vs ${y-1}`,y)));
if(!sel.options.length) DATA.meta.anios.forEach(y=>sel.add(new Option(y,y)));
sel.value=S.y;
function refresh(){ const rb=CFG.reparto_base; document.getElementById('gAjuste').style.display = rb&&rb.activo&&rb.anio_base===S.y-1?'':'none'; build(); onScroll(); }
sel.onchange=()=>{S.y=+sel.value; refresh();};
document.querySelectorAll('#fAjuste button').forEach(b=>b.onclick=()=>{S.aj=b.dataset.v==='1'; document.querySelectorAll('#fAjuste button').forEach(x=>x.classList.toggle('on',x===b)); refresh();});
document.getElementById('metaGen').textContent='· actualizado '+DATA.meta.generado.replace('T',' ').slice(0,16);
refresh();
window.VGME_FUNNELS={data:DATA, calc, state:S};
})();
</script>
